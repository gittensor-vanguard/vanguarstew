name: PR gaming policy

# Run only trusted base/default-branch code. The contributor's head is inspected through GitHub
# metadata and is never checked out or executed by this write-capable workflow.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [test, main]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: pr-gaming-policy-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  enforce:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Enforce commit identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pr_gaming_policy.py
