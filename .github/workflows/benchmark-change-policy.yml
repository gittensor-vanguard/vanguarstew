name: Benchmark change policy

# Only agent/** or agent.py changes, with optional companion tests/** changes, enter the agent
# contribution route directly. Every other project path is maintainer-directed and requires an
# explicitly approved open issue before a contributor PR is opened.
# pull_request_target is required to close fork PRs; the job checks out only the trusted base
# commit and never executes or reads code from the contributor's head ref.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches: [test, main]

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: benchmark-change-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Enforce protected change approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/benchmark_pr_policy.py
