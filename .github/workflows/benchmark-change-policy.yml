name: Benchmark change policy

# The benchmark, scripts, and documentation are maintainer-directed contribution surfaces.
# Contributor changes to them require an explicitly approved open issue before a PR is opened.
# pull_request_target is required to close fork PRs; the job checks out only the trusted base
# commit and never executes or reads code from the contributor's head ref.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches: [test, main]
    paths:
      - "benchmark/**"
      - "scripts/**"
      - "docs/**"
      - "blog/**"
      - "**/*.md"
      - ".github/workflows/benchmark-change-policy.yml"
      - ".github/workflows/pr-integrity.yml"
      - ".github/workflows/pr-reopen-policy.yml"

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: benchmark-change-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Enforce protected change approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/benchmark_pr_policy.py
