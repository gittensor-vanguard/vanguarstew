name: Publish attested eval image

on:
  pull_request:
    branches: [test]
    paths:
      - ".dockerignore"
      - ".github/workflows/publish-eval-image.yml"
      - "agent.py"
      - "agent/**"
      - "benchmark/**"
      - "docker/eval.Dockerfile"
      - "pyproject.toml"
      - "scripts/__init__.py"
      - "scripts/prepare_attested_inputs.py"
      - "scripts/run_attested_eval.py"
      - "scripts/transcript_proxy.py"
      - "vanguarstew_agent_files.json"
  push:
    branches: [test]
    paths:
      - ".dockerignore"
      - ".github/workflows/publish-eval-image.yml"
      - "agent.py"
      - "agent/**"
      - "benchmark/**"
      - "docker/eval.Dockerfile"
      - "pyproject.toml"
      - "scripts/__init__.py"
      - "scripts/prepare_attested_inputs.py"
      - "scripts/run_attested_eval.py"
      - "scripts/transcript_proxy.py"
      - "vanguarstew_agent_files.json"
  # This becomes usable after the workflow reaches the default branch. Dispatches must select test;
  # the publish job's ref guard skips every other branch.
  workflow_dispatch:

concurrency:
  group: publish-eval-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/gittensor-vanguard/vanguarstew-eval

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the proposed image source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the exact single-platform image locally
        run: |
          docker buildx build \
            --file docker/eval.Dockerfile \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --pull=false \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:pr-${GITHUB_SHA}" \
            --load \
            .

      - name: Audit the measured runtime surface
        run: |
          docker run --rm --network none --read-only "${IMAGE_NAME}:pr-${GITHUB_SHA}" \
            python -c 'import json, os; from pathlib import Path; required=["/eval/scripts/prepare_attested_inputs.py", "/eval/scripts/run_attested_eval.py"]; forbidden=["/eval/.git", "/eval/.env", "/eval/receipts", "/eval/tests", "/eval/blog", "/eval/scripts/package_attested_inputs.py"]; result={"uid": os.getuid(), "required_present": all(Path(path).exists() for path in required), "forbidden_absent": all(not Path(path).exists() for path in forbidden)}; print(json.dumps(result, sort_keys=True)); raise SystemExit(0 if result == {"uid": 10001, "required_present": True, "forbidden_absent": True} else 1)'
          docker run --rm --network none --read-only "${IMAGE_NAME}:pr-${GITHUB_SHA}" \
            python -m scripts.run_attested_eval --help >/dev/null

  publish:
    if: >-
      github.repository == 'gittensor-vanguard/vanguarstew' &&
      github.ref == 'refs/heads/test' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the merged image source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish or recover the immutable commit tag
        id: publish
        run: |
          set -euo pipefail
          tag_ref="${IMAGE_NAME}:git-${GITHUB_SHA}"
          metadata_file="${RUNNER_TEMP}/vanguarstew-eval-build.json"
          built_digest=""

          if docker buildx imagetools inspect "${tag_ref}" >/dev/null 2>&1; then
            state="reused"
          else
            docker buildx build \
              --file docker/eval.Dockerfile \
              --platform linux/amd64 \
              --provenance=false \
              --sbom=false \
              --pull=false \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --tag "${tag_ref}" \
              --metadata-file "${metadata_file}" \
              --push \
              .
            built_digest="$(python3 - "${metadata_file}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle).get("containerimage.digest", ""))
          PY
            )"
            state="published"
          fi

          read -r digest media_type <<< "$(
            docker buildx imagetools inspect "${tag_ref}" \
              --format '{{.Manifest.Digest}} {{.Manifest.MediaType}}'
          )"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::GHCR returned a malformed image digest"
            exit 1
          fi
          case "${media_type}" in
            application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json) ;;
            *)
              echo "::error::Expected one image manifest, got ${media_type}"
              exit 1
              ;;
          esac
          if [[ -n "${built_digest}" && "${built_digest}" != "${digest}" ]]; then
            echo "::error::Build and registry digests disagree"
            exit 1
          fi
          read -r image_revision image_source <<< "$(
            docker buildx imagetools inspect "${tag_ref}" \
              --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}} {{index .Image.Config.Labels "org.opencontainers.image.source"}}'
          )"
          if [[ "${image_revision}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Existing image revision label does not match the commit tag"
            exit 1
          fi
          if [[ "${image_source}" != "https://github.com/${GITHUB_REPOSITORY}" ]]; then
            echo "::error::Existing image source label does not match this repository"
            exit 1
          fi

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "reference=${IMAGE_NAME}@${digest}" >> "${GITHUB_OUTPUT}"
          echo "state=${state}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag_ref}" >> "${GITHUB_OUTPUT}"

      - name: Verify an anonymous Polaris-compatible pull
        env:
          IMMUTABLE_REFERENCE: ${{ steps.publish.outputs.reference }}
        run: |
          docker logout ghcr.io >/dev/null
          if ! docker buildx imagetools inspect "${IMMUTABLE_REFERENCE}" >/dev/null 2>&1; then
            echo "::error::The GHCR package is not public. An organization owner must change the vanguarstew-eval package visibility to Public, then rerun this job."
            exit 1
          fi

      - name: Report the immutable image reference
        if: always()
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMMUTABLE_REFERENCE: ${{ steps.publish.outputs.reference }}
          PUBLISH_STATE: ${{ steps.publish.outputs.state }}
          TAG_REFERENCE: ${{ steps.publish.outputs.tag }}
        run: |
          {
            echo "## Attested evaluation image"
            echo
            if [[ -n "${IMMUTABLE_REFERENCE}" ]]; then
              echo "- Immutable reference: \`${IMMUTABLE_REFERENCE}\`"
              echo "- Commit tag: \`${TAG_REFERENCE}\`"
              echo "- Registry digest: \`${DIGEST}\`"
              echo "- Publish state: \`${PUBLISH_STATE}\`"
              echo "- Platform: \`linux/amd64\` (single manifest)"
            else
              echo "Image publication failed before GHCR returned a verified digest."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
